<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karpture | Keep what matters.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #b4518b;
            --bg: #fdfafb;
            --text: #333;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary);
            font-size: 3rem;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-top: 10px;
        }

        .nav {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--white);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Karpture</h1>
        <p>Your browser extension memory journal.</p>
    </div>
    <div class="nav">
        <a href="/login" class="btn btn-primary">Login</a>
        <a href="/signup" class="btn btn-outline">Sign Up</a>
    </div>
</body>

</html>
